<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->
  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <title>Calculator app</title>
  <link rel="stylesheet" href="main.css">
</head>
<body>
  <div class="container">

    <header>
      <p>Calc</p>
      <div class="them-switsh">
        <p>THEME</p>
        <div class="them">
          <p>1 2 3</p>
          <div class="toggle-them">
            <button></button>
          </div>
        </div>
      </div>
    </header>

    <div class="outbut"></div>

    <main>
      <button>7</button>
      <button>8</button>
      <button>9</button>
      <button class="del">del</button>
      <button>4</button>
      <button>5</button>
      <button>6</button>
      <button>+</button>
      <button>1</button>
      <button>2</button>
      <button>3</button>
      <button>-</button>
      <button>.</button>
      <button>0</button>
      <button>/</button>
      <button>x</button>
      <button  class="reset">RESET</button>
      <button class="equal">=</button>
    </main>
  </div>
  <script src="main.js"></script>
</body>
</html>
